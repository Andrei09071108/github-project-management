{
  "name": "Defect",
  "description": "Report a reproducible discrepancy",
  "labels": [
    "bug"
  ],
  "body": [
    {
      "type": "textarea",
      "id": "context",
      "attributes": {
        "label": "Business context",
        "description": "Who is affected and why?"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "scope",
      "attributes": {
        "label": "Expected outcome and scope",
        "description": "Give the expected and observed behaviour and reproduction steps."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "acceptance",
      "attributes": {
        "label": "Acceptance criteria",
        "description": "List observable checks and expected results."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "dependencies",
      "attributes": {
        "label": "Dependencies",
        "description": "Link prerequisites or enter None."
      },
      "validations": {
        "required": true
      }
    }
  ]
}
